<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070a"/>
      <stop offset="50%" stop-color="#070b10"/>
      <stop offset="100%" stop-color="#04060a"/>
    </linearGradient>

    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>

    <linearGradient id="wave-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d8fe0" stop-opacity="0"/>
      <stop offset="18%" stop-color="#22c6ff" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#7cf5ff" stop-opacity="1"/>
      <stop offset="82%" stop-color="#22c6ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0d8fe0" stop-opacity="0"/>
    </linearGradient>

    <pattern id="dots" width="42" height="42" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#1c3b4d" opacity="0.55"/>
    </pattern>

    <filter id="glow-soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glow-line" x="-60%" y="-200%" width="220%" height="500%">
      <feGaussianBlur stdDeviation="4.5"/>
    </filter>

    <filter id="glow-dot" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
  </defs>

  <!-- base background -->
  <rect width="1200" height="300" fill="url(#bg-grad)"/>
  <rect width="1200" height="300" fill="url(#dots)" opacity="0.5"/>
  <rect width="1200" height="300" fill="url(#vignette)"/>

  <!-- faint scattered code fragments -->
  <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" fill="#2ee6ff">
    <text x="26" y="38" font-size="12" opacity="0.16">// building something new</text>
    <text x="26" y="58" font-size="12" opacity="0.10">const idea = () =&gt; refine(idea);</text>

    <text x="1174" y="38" font-size="12" text-anchor="end" opacity="0.14">git status: ready to ship</text>
    <text x="1174" y="58" font-size="12" text-anchor="end" opacity="0.09">function iterate(v) { test(v); }</text>

    <text x="26" y="270" font-size="12" opacity="0.12">01101001 01100100 01100101 01100001</text>
    <text x="26" y="252" font-size="12" opacity="0.09">while (learning) { code(); }</text>

    <text x="1174" y="270" font-size="12" text-anchor="end" opacity="0.14">$ npm run deploy</text>
    <text x="1174" y="252" font-size="12" text-anchor="end" opacity="0.09">export default project;</text>

    <text x="20" y="150" font-size="13" opacity="0.20">&gt;_</text>
    <text x="1180" y="154" font-size="13" text-anchor="end" opacity="0.18">&lt;/&gt;</text>
  </g>

  <!-- gentle flicker on a couple of the fragments -->
  <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" fill="#2ee6ff">
    <text x="26" y="38" font-size="12">
      <animate attributeName="opacity" values="0.16;0.05;0.16" dur="7s" repeatCount="indefinite"/>
      // building something new
    </text>
    <text x="1174" y="58" font-size="12" text-anchor="end">
      <animate attributeName="opacity" values="0.09;0.20;0.09" dur="9s" repeatCount="indefinite"/>
      function iterate(v) { test(v); }
    </text>
    <text x="26" y="252" font-size="12">
      <animate attributeName="opacity" values="0.09;0.03;0.09" dur="8s" repeatCount="indefinite"/>
      while (learning) { code(); }
    </text>
    <text x="1174" y="270" font-size="12" text-anchor="end">
      <animate attributeName="opacity" values="0.14;0.24;0.14" dur="6.5s" repeatCount="indefinite"/>
      $ npm run deploy
    </text>
  </g>

  <!-- floating binary digits drifting upward -->
  <g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="11" fill="#54e8ff">
    <text x="140" y="290" opacity="0">0
      <animate attributeName="opacity" values="0;0.28;0" dur="11s" begin="-1s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-230" dur="11s" begin="-1s" repeatCount="indefinite"/>
    </text>
    <text x="205" y="300" opacity="0">1
      <animate attributeName="opacity" values="0;0.24;0" dur="13s" begin="-4s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-250" dur="13s" begin="-4s" repeatCount="indefinite"/>
    </text>
    <text x="330" y="295" opacity="0">0
      <animate attributeName="opacity" values="0;0.20;0" dur="12s" begin="-7s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-240" dur="12s" begin="-7s" repeatCount="indefinite"/>
    </text>
    <text x="990" y="300" opacity="0">1
      <animate attributeName="opacity" values="0;0.26;0" dur="10s" begin="-2.5s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-235" dur="10s" begin="-2.5s" repeatCount="indefinite"/>
    </text>
    <text x="1055" y="292" opacity="0">0
      <animate attributeName="opacity" values="0;0.22;0" dur="14s" begin="-9s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-245" dur="14s" begin="-9s" repeatCount="indefinite"/>
    </text>
    <text x="70" y="298" opacity="0">1
      <animate attributeName="opacity" values="0;0.18;0" dur="15s" begin="-6s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-255" dur="15s" begin="-6s" repeatCount="indefinite"/>
    </text>
    <text x="1130" y="296" opacity="0">0
      <animate attributeName="opacity" values="0;0.25;0" dur="12.5s" begin="-3s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-238" dur="12.5s" begin="-3s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- top neon wave -->
  <g>
    <path id="wave-top-glow" d="M0,26 C150,6 300,46 450,26 C600,6 750,46 900,26 C1050,6 1150,36 1200,26"
          fill="none" stroke="url(#wave-grad)" stroke-width="7" opacity="0.35" filter="url(#glow-line)">
      <animate attributeName="d" dur="9s" repeatCount="indefinite"
        values="M0,26 C150,6 300,46 450,26 C600,6 750,46 900,26 C1050,6 1150,36 1200,26;
                M0,26 C150,46 300,6 450,26 C600,46 750,6 900,26 C1050,46 1150,16 1200,26;
                M0,26 C150,6 300,46 450,26 C600,6 750,46 900,26 C1050,6 1150,36 1200,26"/>
    </path>
    <path id="wave-top" d="M0,26 C150,6 300,46 450,26 C600,6 750,46 900,26 C1050,6 1150,36 1200,26"
          fill="none" stroke="url(#wave-grad)" stroke-width="1.6" stroke-linecap="round"
          stroke-dasharray="4 9">
      <animate attributeName="d" dur="9s" repeatCount="indefinite"
        values="M0,26 C150,6 300,46 450,26 C600,6 750,46 900,26 C1050,6 1150,36 1200,26;
                M0,26 C150,46 300,6 450,26 C600,46 750,6 900,26 C1050,46 1150,16 1200,26;
                M0,26 C150,6 300,46 450,26 C600,6 750,46 900,26 C1050,6 1150,36 1200,26"/>
      <animate attributeName="stroke-dashoffset" from="0" to="-130" dur="6s" repeatCount="indefinite"/>
    </path>
    <circle r="2.6" fill="#bffaff" filter="url(#glow-dot)">
      <animateMotion dur="6s" begin="0s" repeatCount="indefinite"
        path="M0,26 C150,6 300,46 450,26 C600,6 750,46 900,26 C1050,6 1150,36 1200,26"/>
    </circle>
    <circle r="2.2" fill="#7cf5ff" filter="url(#glow-dot)">
      <animateMotion dur="6s" begin="-2s" repeatCount="indefinite"
        path="M0,26 C150,6 300,46 450,26 C600,6 750,46 900,26 C1050,6 1150,36 1200,26"/>
    </circle>
    <circle r="2.2" fill="#7cf5ff" filter="url(#glow-dot)">
      <animateMotion dur="6s" begin="-4s" repeatCount="indefinite"
        path="M0,26 C150,6 300,46 450,26 C600,6 750,46 900,26 C1050,6 1150,36 1200,26"/>
    </circle>
  </g>

  <!-- bottom neon wave -->
  <g>
    <path id="wave-bot-glow" d="M0,276 C150,296 300,256 450,276 C600,296 750,256 900,276 C1050,296 1150,266 1200,276"
          fill="none" stroke="url(#wave-grad)" stroke-width="7" opacity="0.35" filter="url(#glow-line)">
      <animate attributeName="d" dur="10s" repeatCount="indefinite"
        values="M0,276 C150,296 300,256 450,276 C600,296 750,256 900,276 C1050,296 1150,266 1200,276;
                M0,276 C150,256 300,296 450,276 C600,256 750,296 900,276 C1050,256 1150,286 1200,276;
                M0,276 C150,296 300,256 450,276 C600,296 750,256 900,276 C1050,296 1150,266 1200,276"/>
    </path>
    <path id="wave-bot" d="M0,276 C150,296 300,256 450,276 C600,296 750,256 900,276 C1050,296 1150,266 1200,276"
          fill="none" stroke="url(#wave-grad)" stroke-width="1.6" stroke-linecap="round"
          stroke-dasharray="4 9">
      <animate attributeName="d" dur="10s" repeatCount="indefinite"
        values="M0,276 C150,296 300,256 450,276 C600,296 750,256 900,276 C1050,296 1150,266 1200,276;
                M0,276 C150,256 300,296 450,276 C600,256 750,296 900,276 C1050,256 1150,286 1200,276;
                M0,276 C150,296 300,256 450,276 C600,296 750,256 900,276 C1050,296 1150,266 1200,276"/>
      <animate attributeName="stroke-dashoffset" from="0" to="130" dur="7s" repeatCount="indefinite"/>
    </path>
    <circle r="2.6" fill="#bffaff" filter="url(#glow-dot)">
      <animateMotion dur="7s" begin="-1s" repeatCount="indefinite"
        path="M0,276 C150,296 300,256 450,276 C600,296 750,256 900,276 C1050,296 1150,266 1200,276"/>
    </circle>
    <circle r="2.2" fill="#7cf5ff" filter="url(#glow-dot)">
      <animateMotion dur="7s" begin="-3.5s" repeatCount="indefinite"
        path="M0,276 C150,296 300,256 450,276 C600,296 750,256 900,276 C1050,296 1150,266 1200,276"/>
    </circle>
  </g>

  <!-- center text block -->
  <g text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">

    <!-- soft glow duplicate of headline -->
    <text x="600" y="141" font-size="27" font-weight="700" fill="#7cf5ff" filter="url(#glow-soft)" opacity="0.22">
      <animate attributeName="opacity" values="0.16;0.30;0.16" dur="6s" repeatCount="indefinite"/>
      Gosto de transformar ideias em algo que você pode usar.
    </text>

    <!-- crisp stable headline -->
    <text x="600" y="141" font-size="27" font-weight="700" fill="#f3f8fb">
      Gosto de transformar ideias em algo que você pode usar.
    </text>

    <!-- accent underline -->
    <rect x="530" y="156" width="140" height="2" rx="1" fill="url(#wave-grad)" opacity="0.8"/>

    <text x="600" y="182" font-size="14.5" fill="#9db3c4">
      Pensar no detalhe, testar, errar e melhorar faz parte do processo.
    </text>

    <text x="600" y="206" font-size="13" fill="#71889b">
      Um projeto de cada vez, sempre tentando fazer melhor.
    </text>
  </g>
</svg>
