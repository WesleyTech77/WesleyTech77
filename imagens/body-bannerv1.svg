<svg viewBox="0 0 800 780" xmlns="http://www.w3.org/2000/svg" font-family="'Fira Code','Consolas','Menlo',monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1015"/>
      <stop offset="60%" stop-color="#0a0f14"/>
      <stop offset="100%" stop-color="#090d12"/>
    </linearGradient>

    <linearGradient id="headerBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e151b"/>
      <stop offset="100%" stop-color="#0b1015"/>
    </linearGradient>

    <filter id="blurGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>

    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="1.3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="cardClip">
      <rect x="0" y="0" width="800" height="780" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect x="0" y="0" width="800" height="780" fill="url(#cardBg)"/>

    <!-- ambient bokeh glow, subtle, same cool family -->
    <circle cx="740" cy="60" r="90" fill="#1583a8" opacity="0.10" filter="url(#blurGlow)"/>
    <circle cx="40" cy="740" r="110" fill="#0e6c8c" opacity="0.09" filter="url(#blurGlow)">
      <animate attributeName="opacity" values="0.06;0.11;0.06" dur="9s" repeatCount="indefinite"/>
    </circle>

    <!-- faint watermark mark -->
    <text x="740" y="720" font-size="90" fill="#12232c" opacity="0.35" text-anchor="middle" font-weight="700">&lt;/&gt;</text>

    <!-- faint circuit-style dot texture -->
    <g opacity="0.06">
      <pattern id="dots2" width="24" height="24" patternUnits="userSpaceOnUse">
        <circle cx="1" cy="1" r="1" fill="#2fb4d9"/>
      </pattern>
      <rect x="0" y="46" width="800" height="734" fill="url(#dots2)"/>
    </g>

    <!-- header bar -->
    <rect x="0" y="0" width="800" height="46" fill="url(#headerBg)"/>
    <line x1="0" y1="46" x2="800" y2="46" stroke="#142029" stroke-width="1"/>

    <circle cx="28" cy="23" r="6" fill="#2ea8d6" opacity="0.85"/>
    <circle cx="50" cy="23" r="6" fill="#4fc3e8" opacity="0.65"/>
    <circle cx="72" cy="23" r="6" fill="#7fdcf5" opacity="0.45"/>

    <text x="100" y="27" font-size="12.5" fill="#6f93ab">index.html</text>
    <text x="776" y="27" font-size="11" fill="#33505f" text-anchor="end">UTF-8</text>

    <!-- gutter separator -->
    <line x1="62" y1="46" x2="62" y2="780" stroke="#131e26" stroke-width="1"/>

    <!-- traveling light along the gutter -->
    <rect x="61" y="0" width="2" height="14" fill="#7fe8ff" opacity="0.9" filter="url(#softGlow)">
      <animate attributeName="y" values="46;734;46" dur="22s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.85;0" keyTimes="0;0.5;1" dur="22s" repeatCount="indefinite"/>
    </rect>

    <!-- ===================== code content ===================== -->
    <g font-size="14.5">

      <!-- line numbers -->
      <g fill="#33505f" font-size="12.5" text-anchor="end">
        <text x="52" y="74">01</text>
        <text x="52" y="104">02</text>
        <text x="52" y="134">03</text>
        <text x="52" y="164">04</text>
        <text x="52" y="194">05</text>
        <text x="52" y="224">06</text>
        <text x="52" y="254">07</text>
        <text x="52" y="284">08</text>
        <text x="52" y="314">09</text>
        <text x="52" y="344">10</text>
        <text x="52" y="374">11</text>
        <text x="52" y="404">12</text>
        <text x="52" y="434">13</text>
        <text x="52" y="464">14</text>
        <text x="52" y="494">15</text>
        <text x="52" y="524">16</text>
        <text x="52" y="554">17</text>
        <text x="52" y="584">18</text>
        <text x="52" y="614">19</text>
        <text x="52" y="644">20</text>
        <text x="52" y="674">21</text>
        <text x="52" y="704">22</text>
        <text x="52" y="734">23</text>
      </g>

      <!-- line 1: <h2 align="center">Sou uma pessoa curiosa, criativa e que -->
      <text x="76" y="74">
        <animate attributeName="opacity" values="0.55;1;1;0.55" keyTimes="0;0.15;0.85;1" dur="13s" repeatCount="indefinite"/>
        <tspan fill="#3f7ea3">&lt;</tspan><tspan fill="#4fd8f0">h2</tspan><tspan fill="#7fa6c2"> align</tspan><tspan fill="#5c7c92">=</tspan><tspan fill="#5eead4">"center"</tspan><tspan fill="#3f7ea3">&gt;</tspan><tspan fill="#dbe6ee">Sou uma pessoa curiosa, criativa e que</tspan>
      </text>

      <!-- line 2: continuation + closing h2 -->
      <text x="94" y="104">
        <animate attributeName="opacity" values="0.55;1;1;0.55" keyTimes="0;0.15;0.85;1" dur="13s" begin="0.2s" repeatCount="indefinite"/>
        <tspan fill="#dbe6ee">gosta de transformar ideias em algo real</tspan><tspan fill="#3f7ea3">&lt;/</tspan><tspan fill="#4fd8f0">h2</tspan><tspan fill="#3f7ea3">&gt;</tspan>
      </text>

      <!-- line 3: blank -->

      <!-- line 4: <p align="center"> -->
      <text x="76" y="164">
        <animate attributeName="opacity" values="0.5;0.95;0.95;0.5" keyTimes="0;0.15;0.85;1" dur="13s" begin="0.4s" repeatCount="indefinite"/>
        <tspan fill="#3f7ea3">&lt;</tspan><tspan fill="#4fd8f0">p</tspan><tspan fill="#7fa6c2"> align</tspan><tspan fill="#5c7c92">=</tspan><tspan fill="#5eead4">"center"</tspan><tspan fill="#3f7ea3">&gt;</tspan>
      </text>

      <!-- line 5: content -->
      <text x="94" y="194" fill="#c8d3dc">
        Gosto de aprender coisas novas, entender como elas funcionam
      </text>

      <!-- line 6: content continuation -->
      <text x="94" y="224" fill="#c8d3dc">
        e descobrir até onde posso levar uma ideia. Tenho interesse por
      </text>

      <!-- line 7: content continuation -->
      <text x="94" y="254" fill="#c8d3dc">
        tecnologia, programação, design, jogos e criação de histórias e mundos
      </text>

      <!-- line 8: </p> -->
      <text x="76" y="284">
        <animate attributeName="opacity" values="0.5;0.95;0.95;0.5" keyTimes="0;0.15;0.85;1" dur="13s" begin="0.6s" repeatCount="indefinite"/>
        <tspan fill="#3f7ea3">&lt;/</tspan><tspan fill="#4fd8f0">p</tspan><tspan fill="#3f7ea3">&gt;</tspan>
      </text>

      <!-- line 9: blank -->

      <!-- line 10: <p align="center"> -->
      <text x="76" y="344">
        <animate attributeName="opacity" values="0.5;0.95;0.95;0.5" keyTimes="0;0.15;0.85;1" dur="13s" begin="0.8s" repeatCount="indefinite"/>
        <tspan fill="#3f7ea3">&lt;</tspan><tspan fill="#4fd8f0">p</tspan><tspan fill="#7fa6c2"> align</tspan><tspan fill="#5c7c92">=</tspan><tspan fill="#5eead4">"center"</tspan><tspan fill="#3f7ea3">&gt;</tspan>
      </text>

      <!-- line 11: content -->
      <text x="94" y="374" fill="#c8d3dc">
        Costumo prestar bastante atenção aos detalhes
      </text>

      <!-- line 12: content continuation -->
      <text x="94" y="404" fill="#c8d3dc">
        e busco sempre melhorar aquilo que crio
      </text>

      <!-- line 13: </p> -->
      <text x="76" y="434">
        <animate attributeName="opacity" values="0.5;0.95;0.95;0.5" keyTimes="0;0.15;0.85;1" dur="13s" begin="1s" repeatCount="indefinite"/>
        <tspan fill="#3f7ea3">&lt;/</tspan><tspan fill="#4fd8f0">p</tspan><tspan fill="#3f7ea3">&gt;</tspan>
      </text>

      <!-- line 14: blank -->

      <!-- line 15: <p align="center"> -->
      <text x="76" y="494">
        <animate attributeName="opacity" values="0.5;0.95;0.95;0.5" keyTimes="0;0.15;0.85;1" dur="13s" begin="1.2s" repeatCount="indefinite"/>
        <tspan fill="#3f7ea3">&lt;</tspan><tspan fill="#4fd8f0">p</tspan><tspan fill="#7fa6c2"> align</tspan><tspan fill="#5c7c92">=</tspan><tspan fill="#5eead4">"center"</tspan><tspan fill="#3f7ea3">&gt;</tspan>
      </text>

      <!-- line 16: <i>Acredito que errar faz parte do aprendizado. Para -->
      <text x="94" y="524">
        <animate attributeName="opacity" values="0.55;1;1;0.55" keyTimes="0;0.15;0.85;1" dur="13s" begin="1.4s" repeatCount="indefinite"/>
        <tspan fill="#3f7ea3">&lt;</tspan><tspan fill="#4fd8f0">i</tspan><tspan fill="#3f7ea3">&gt;</tspan><tspan fill="#8fd9ee" font-style="italic">Acredito que errar faz parte do aprendizado. Para</tspan>
      </text>

      <!-- line 17: content continuation -->
      <text x="94" y="554" fill="#8fd9ee" font-style="italic">
        mim, o importante é continuar tentando, aprender com
      </text>

      <!-- line 18: content continuation + closing i -->
      <text x="94" y="584">
        <tspan fill="#8fd9ee" font-style="italic">cada experiência e evoluir um pouco a cada projeto</tspan><tspan fill="#3f7ea3">&lt;/</tspan><tspan fill="#4fd8f0">i</tspan><tspan fill="#3f7ea3">&gt;</tspan>
      </text>

      <!-- line 19: </p> -->
      <text x="76" y="614">
        <tspan fill="#3f7ea3">&lt;/</tspan><tspan fill="#4fd8f0">p</tspan><tspan fill="#3f7ea3">&gt;</tspan>
      </text>

      <!-- line 20: blank -->

      <!-- line 21: <p align="center"> -->
      <text x="76" y="674">
        <tspan fill="#3f7ea3">&lt;</tspan><tspan fill="#4fd8f0">p</tspan><tspan fill="#7fa6c2"> align</tspan><tspan fill="#5c7c92">=</tspan><tspan fill="#5eead4">"center"</tspan><tspan fill="#3f7ea3">&gt;</tspan>
      </text>

      <!-- line 22: content -->
      <text x="94" y="704" fill="#c8d3dc">
        Pensar no detalhe, testar, errar e melhorar faz parte do processo!!
      </text>

      <!-- line 23: </p> with blinking cursor -->
      <text x="76" y="734">
        <tspan fill="#3f7ea3">&lt;/</tspan><tspan fill="#4fd8f0">p</tspan><tspan fill="#3f7ea3">&gt;</tspan>
      </text>
      <rect x="112" y="722" width="8" height="15" fill="#7fe8ff" filter="url(#softGlow)">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.02;0.05;0.5;0.53;1" dur="1.6s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- subtle outer border -->
    <rect x="1" y="1" width="798" height="778" rx="17" fill="none" stroke="#16323f" stroke-width="1.3" opacity="0.7"/>
  </g>
</svg>
