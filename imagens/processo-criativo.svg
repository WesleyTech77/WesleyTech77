<svg width="480" height="480" viewBox="0 0 480 480" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <!-- ============================================================
       ANIMAÇÃO "PROCESSO CRIATIVO" — loop perfeito (SVG/SMIL nativo)
       Inspirado apenas na estética do banner de referência
       (fundo escuro, linhas finas em ciano neon, brilho suave).

       Narrativa visual (ciclo de 10s, sem textos ou ícones):
       1) uma ideia surge (ponto central pulsando)
       2) elementos se organizam e se constroem (linhas que se
          desenham a partir do centro, formando uma estrutura)
       3) pequenos ajustes e tentativas (um ou dois traços
          "piscam" e se refazem — testar, errar, melhorar)
       4) o resultado toma forma (contorno se fecha, pulso de luz)
       5) tudo se recolhe suavemente de volta ao ponto inicial,
          preparando o início do próximo ciclo/projeto

       TÉCNICA DE LOOP PERFEITO:
       Todas as animações usam begin="0s" e o mesmo dur="10s" com
       repeatCount="indefinite", e cada uma tem keyTimes cobrindo
       de 0 a 1 com o mesmo valor no início e no fim. Assim, ao
       reiniciar, o estado final é idêntico ao estado inicial e a
       costura do loop não é perceptível.
       ============================================================ -->

  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#151920"/>
      <stop offset="100%" stop-color="#0b0d10"/>
    </radialGradient>

    <clipPath id="frameClip">
      <rect x="0" y="0" width="480" height="480" rx="20" ry="20"/>
    </clipPath>

    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="strongGlow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <radialGradient id="seedFill" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#eafcff"/>
      <stop offset="45%" stop-color="#5be6ff"/>
      <stop offset="100%" stop-color="#00a8d6"/>
    </radialGradient>

    <pattern id="dotGrid" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#7dd3fc"/>
    </pattern>
  </defs>

  <g clip-path="url(#frameClip)">
    <!-- Fundo -->
    <rect x="0" y="0" width="480" height="480" fill="url(#bgGlow)"/>
    <rect x="0" y="0" width="480" height="480" fill="url(#dotGrid)" opacity="0.05"/>

    <!-- ============ LINHAS: centro -> nós (construção) ============ -->
    <g fill="none" stroke="#00d9ff" stroke-width="1.6" filter="url(#softGlow)" opacity="0.85">
      <!-- N1 topo -->
      <line x1="240" y1="240" x2="240" y2="110" pathLength="1" stroke-dasharray="1">
        <animate attributeName="stroke-dashoffset"
                 keyTimes="0;0.10;0.18;0.86;0.90;1"
                 values="1;1;0;0;1;1"
                 begin="0s" dur="10s" repeatCount="indefinite"/>
      </line>
      <!-- N2 sup. direita — com ajuste/tentativa -->
      <line x1="240" y1="240" x2="352.58" y2="175" pathLength="1" stroke-dasharray="1">
        <animate attributeName="stroke-dashoffset"
                 keyTimes="0;0.135;0.215;0.43;0.47;0.865;0.905;1"
                 values="1;1;0;0.30;0;0;1;1"
                 begin="0s" dur="10s" repeatCount="indefinite"/>
      </line>
      <!-- N3 inf. direita -->
      <line x1="240" y1="240" x2="352.58" y2="305" pathLength="1" stroke-dasharray="1">
        <animate attributeName="stroke-dashoffset"
                 keyTimes="0;0.17;0.25;0.87;0.91;1"
                 values="1;1;0;0;1;1"
                 begin="0s" dur="10s" repeatCount="indefinite"/>
      </line>
      <!-- N4 base -->
      <line x1="240" y1="240" x2="240" y2="370" pathLength="1" stroke-dasharray="1">
        <animate attributeName="stroke-dashoffset"
                 keyTimes="0;0.205;0.285;0.875;0.915;1"
                 values="1;1;0;0;1;1"
                 begin="0s" dur="10s" repeatCount="indefinite"/>
      </line>
      <!-- N5 inf. esquerda — com ajuste/tentativa -->
      <line x1="240" y1="240" x2="127.42" y2="305" pathLength="1" stroke-dasharray="1">
        <animate attributeName="stroke-dashoffset"
                 keyTimes="0;0.24;0.32;0.48;0.52;0.88;0.92;1"
                 values="1;1;0;0.30;0;0;1;1"
                 begin="0s" dur="10s" repeatCount="indefinite"/>
      </line>
      <!-- N6 sup. esquerda -->
      <line x1="240" y1="240" x2="127.42" y2="175" pathLength="1" stroke-dasharray="1">
        <animate attributeName="stroke-dashoffset"
                 keyTimes="0;0.275;0.355;0.885;0.925;1"
                 values="1;1;0;0;1;1"
                 begin="0s" dur="10s" repeatCount="indefinite"/>
      </line>
    </g>

    <!-- ============ CONTORNO FINAL (resultado tomando forma) ============ -->
    <path d="M 240 110 L 352.58 175 L 352.58 305 L 240 370 L 127.42 305 L 127.42 175 Z"
          fill="none" stroke="#8fefff" stroke-width="2" filter="url(#softGlow)"
          pathLength="1" stroke-dasharray="1">
      <animate attributeName="stroke-dashoffset"
               keyTimes="0;0.55;0.63;0.78;0.83;1"
               values="1;1;0;0;1;1"
               begin="0s" dur="10s" repeatCount="indefinite"/>
    </path>

    <!-- ============ PULSO DE LUZ ao concluir o resultado ============ -->
    <circle cx="240" cy="240" r="0" fill="none" stroke="#00d9ff" stroke-width="1.5" filter="url(#strongGlow)">
      <animate attributeName="r"
               keyTimes="0;0.63;0.78;1"
               values="0;0;92;0"
               begin="0s" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="opacity"
               keyTimes="0;0.60;0.64;0.78;1"
               values="0;0;0.55;0;0"
               begin="0s" dur="10s" repeatCount="indefinite"/>
    </circle>

    <!-- ============ NÓS (pontos de construção) ============ -->
    <g fill="#00d9ff" filter="url(#softGlow)">
      <!-- N1 -->
      <circle cx="240" cy="110" r="5" opacity="0">
        <animate attributeName="opacity"
                 keyTimes="0;0.18;0.21;0.80;0.84;1"
                 values="0;0;1;1;0;0"
                 begin="0s" dur="10s" repeatCount="indefinite"/>
      </circle>
      <!-- N2 (ajuste) -->
      <circle cx="352.58" cy="175" r="5" opacity="0">
        <animate attributeName="opacity"
                 keyTimes="0;0.215;0.245;0.43;0.47;0.80;0.84;1"
                 values="0;0;1;0.25;1;1;0;0"
                 begin="0s" dur="10s" repeatCount="indefinite"/>
      </circle>
      <!-- N3 -->
      <circle cx="352.58" cy="305" r="5" opacity="0">
        <animate attributeName="opacity"
                 keyTimes="0;0.25;0.28;0.80;0.84;1"
                 values="0;0;1;1;0;0"
                 begin="0s" dur="10s" repeatCount="indefinite"/>
      </circle>
      <!-- N4 -->
      <circle cx="240" cy="370" r="5" opacity="0">
        <animate attributeName="opacity"
                 keyTimes="0;0.285;0.315;0.80;0.84;1"
                 values="0;0;1;1;0;0"
                 begin="0s" dur="10s" repeatCount="indefinite"/>
      </circle>
      <!-- N5 (ajuste) -->
      <circle cx="127.42" cy="305" r="5" opacity="0">
        <animate attributeName="opacity"
                 keyTimes="0;0.32;0.35;0.48;0.52;0.80;0.84;1"
                 values="0;0;1;0.25;1;1;0;0"
                 begin="0s" dur="10s" repeatCount="indefinite"/>
      </circle>
      <!-- N6 -->
      <circle cx="127.42" cy="175" r="5" opacity="0">
        <animate attributeName="opacity"
                 keyTimes="0;0.355;0.385;0.80;0.84;1"
                 values="0;0;1;1;0;0"
                 begin="0s" dur="10s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- ============ PONTO CENTRAL: a ideia ============ -->
    <circle cx="240" cy="240" r="3" fill="url(#seedFill)" filter="url(#strongGlow)">
      <animate attributeName="r"
               keyTimes="0;0.08;0.15;0.60;0.68;0.92;1"
               values="3;9;4;4;9;4;3"
               begin="0s" dur="10s" repeatCount="indefinite"
               calcMode="spline"
               keySplines="0.3 0 0.3 1;0.3 0 0.3 1;0.3 0 0.3 1;0.3 0 0.3 1;0.3 0 0.3 1;0.3 0 0.3 1"/>
    </circle>

  </g>

  <!-- Borda sutil de acabamento -->
  <rect x="1" y="1" width="478" height="478" rx="19" ry="19"
        fill="none" stroke="#1c2128" stroke-width="1"/>

</svg>
